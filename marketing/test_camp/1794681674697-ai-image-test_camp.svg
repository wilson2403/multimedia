<svg width="100%" height="100%" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(222,47%,11%)"/>
      <stop offset="100%" stop-color="hsl(222,47%,20%)"/>
    </linearGradient>

    <!-- Accent gradient for phone screen -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(263,70%,50%)"/>
      <stop offset="100%" stop-color="hsl(262,83%,58%)"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.4)"/>
    </filter>

    <!-- Decorative circles -->
    <radialGradient id="circleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(262,83%,58%)" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="hsl(262,83%,58%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Decorative floating circles -->
  <g opacity="0.4">
    <circle cx="150" cy="100" r="80" fill="url(#circleGrad)"/>
    <circle cx="650" cy="80" r="60" fill="url(#circleGrad)"/>
    <circle cx="400" cy="500" r="100" fill="url(#circleGrad)"/>
    <circle cx="250" cy="400" r="70" fill="url(#circleGrad)"/>
    <circle cx="720" cy="350" r="50" fill="url(#circleGrad)"/>
  </g>

  <!-- Headline -->
  <text x="400" y="130" text-anchor="middle" fill="hsl(262,83%,58%)" font-family="Helvetica,Arial,sans-serif" font-size="64" font-weight="bold" letter-spacing="1">
    Crea Tu App
  </text>

  <!-- Subheadline (optional) -->
  <text x="400" y="190" text-anchor="middle" fill="white" font-family="Helvetica,Arial,sans-serif" font-size="24" opacity="0.85">
    Diseña, construye y lanza tu aplicación hoy
  </text>

  <!-- Phone mockup -->
  <g filter="url(#shadow)">
    <rect x="520" y="180" width="200" height="400" rx="20" ry="20" fill="white"/>
    <!-- Screen -->
    <rect x="540" y="210" width="160" height="340" rx="12" ry="12" fill="url(#screenGrad)"/>
    <!-- App icons on screen -->
    <g transform="translate(560,260)">
      <rect width="40" height="40" rx="8" ry="8" fill="white" opacity="0.9"/>
      <rect x="60" width="40" height="40" rx="8" ry="8" fill="white" opacity="0.9"/>
      <rect y="60" width="40" height="40" rx="8" ry="8" fill="white" opacity="0.9"/>
      <rect x="60" y="60" width="40" height="40" rx="8" ry="8" fill="white" opacity="0.9"/>
    </g>
    <!-- Home button -->
    <circle cx="620" cy="560" r="12" fill="rgba(0,0,0,0.15)"/>
  </g>

  <!-- Abstract code lines (representing development) -->
  <g stroke="hsl(262,83%,58%)" stroke-width="2" opacity="0.7">
    <line x1="100" y1="250" x2="300" y2="250" stroke-dasharray="5 5"/>
    <line x1="120" y1="280" x2="320" y2="280" stroke-dasharray="5 5"/>
    <line x1="140" y1="310" x2="340" y2="310" stroke-dasharray="5 5"/>
    <line x1="160" y1="340" x2="360" y2="340" stroke-dasharray="5 5"/>
  </g>
</svg>