<svg width="100%" height="100%" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="hsl(222,47%,15%)"/>
      <stop offset="100%" stop-color="hsl(222,47%,8%)"/>
    </linearGradient>
    <!-- Primary Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(262,83%,68%)"/>
      <stop offset="100%" stop-color="hsl(262,83%,48%)"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>

  <!-- Headline -->
  <text x="400" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="48" font-weight="bold" fill="hsl(262,83%,58%)"
        style="letter-spacing:2px;">
    Crea Tu App
  </text>

  <!-- Laptop Mockup -->
  <g filter="url(#shadow)" transform="translate(100,200)">
    <!-- Base -->
    <rect x="0" y="250" width="600" height="20" rx="10" ry="10" fill="hsl(262,70%,30%)"/>
    <!-- Screen -->
    <rect x="30" y="0" width="540" height="250" rx="15" ry="15" fill="url(#primaryGrad)"/>
    <!-- UI Elements Inside Screen -->
    <g transform="translate(45,30)">
      <!-- Top Bar -->
      <rect width="510" height="30" rx="5" ry="5" fill="rgba(255,255,255,0.2)"/>
      <!-- App Cards -->
      <rect x="0" y="70" width="150" height="100" rx="12" ry="12" fill="rgba(255,255,255,0.15)"/>
      <rect x="180" y="70" width="150" height="100" rx="12" ry="12" fill="rgba(255,255,255,0.15)"/>
      <rect x="360" y="70" width="150" height="100" rx="12" ry="12" fill="rgba(255,255,255,0.15)"/>
      <!-- Code Snippet -->
      <rect x="0" y="200" width="510" height="40" rx="5" ry="5" fill="rgba(0,0,0,0.2)"/>
      <text x="15" y="227" font-family="monospace" font-size="14" fill="#fff">
        &lt;div class="app-builder"&gt;...
      </text>
    </g>
  </g>

  <!-- Mobile Phone Mockup -->
  <g filter="url(#shadow)" transform="translate(550,260) scale(0.8)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="120" height="240" rx="20" ry="20" fill="hsl(262,70%,30%)"/>
    <!-- Screen -->
    <rect x="10" y="20" width="100" height="200" rx="12" ry="12" fill="url(#primaryGrad)"/>
    <!-- Inside Screen Icons -->
    <g transform="translate(20,40)">
      <circle cx="20" cy="20" r="12" fill="rgba(255,255,255,0.25)"/>
      <circle cx="60" cy="20" r="12" fill="rgba(255,255,255,0.25)"/>
      <circle cx="20" cy="60" r="12" fill="rgba(255,255,255,0.25)"/>
      <circle cx="60" cy="60" r="12" fill="rgba(255,255,255,0.25)"/>
    </g>
  </g>

  <!-- Floating Abstract Elements (charts, lines) -->
  <g opacity="0.6">
    <path d="M150 150 C200 100, 300 200, 350 150 S500 200, 550 120"
          stroke="hsl(263,70%,50%)" stroke-width="4" fill="none"/>
    <circle cx="150" cy="150" r="6" fill="hsl(263,70%,50%)"/>
    <circle cx="350" cy="150" r="6" fill="hsl(263,70%,50%)"/>
    <circle cx="550" cy="120" r="6" fill="hsl(263,70%,50%)"/>
  </g>

</svg>