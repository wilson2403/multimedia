<text x="50%" y="405" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="semibold" fill="#ffffff" opacity="0.85">Rápidamente, la escena cambia a la misma</text>
