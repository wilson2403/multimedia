        <text x="50%" y="190" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="black" fill="#ffffff" opacity="0.6" letter-spacing="4">DISEÑO DE CAMPAÑA INTELIGENTE</text>
